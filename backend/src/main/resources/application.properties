# ===============================
# 1. SERVER CONFIGURATION
# ===============================
spring.application.name=customJewelry
server.port=8080

# ===============================
# 2. MONGODB DATABASE CONNECTION
# ===============================
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=customJewelry
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# ===============================
# 3. GOOGLE GEMINI AI CONFIGURATION
# ===============================
# ?? PASTE YOUR NEW API KEY HERE
gemini.api.key=${GEMINI_API_KEY}

# Model 1: For Text (Descriptions) - Using Flash Latest
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent
#
## Model 2: For Images (Nano Banana) - Using Gemini 2.5 Flash Image
#gemini.image.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent

# ===============================
# REPLICATE AI (FLUX.1 / Raphael Quality)
# ===============================
replicate.api.key=${REPLICATE_API_KEY}
replicate.api.url=https://api.replicate.com/v1/predictions